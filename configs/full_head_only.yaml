# GPU: frozen first 20 Qwen layers + head only, full train split (~250K questions, ~3.9K steps at batch 64).
seed: 0

model:
  name: Qwen/Qwen3-0.6B
  num_layers: 20            # run only the first N of Qwen's 28 decoder layers (null = all)

data:
  max_train_questions: null   # null = full train split
  max_test_questions: 5000    # 0 = no validation, null = full test split (46K, slow to run every eval)
  max_state_tokens: 512
  max_choice_tokens: 64
  batch_size: 64
  num_workers: 8

lora:
  last_k_layers: 0          # LoRA on the attention projections of the last k *kept* layers (0 = frozen Qwen)
  r: 8
  alpha: 16
  dropout: 0.0

head:
  new_dim: 512
  num_layers: 2

optim:
  epochs: 1
  lr_lora: 1.0e-4
  lr_head: 1.0e-3           # not rescaled for batch 64; the head diverged once at 1e-3 with batch 16
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0

logging:
  log_every: 20
  eval_every: 500           # validation; checkpoints/best is kept by test accuracy
  save_every: 500           # overwrites checkpoints/latest
